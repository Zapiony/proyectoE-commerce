<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="bg-light">

<div class="container my-5 pagina_producto">
    <div class="row g-4 align-items-start contenedor_producto">
        <!-- columna izquierda -->
        <div class="col-12 col-md-5 text-center galeria_producto">
            <img id="imagenPrincipal" class="img-fluid rounded shadow-sm mb-3" alt="Imagen principal">

            <div class="d-flex justify-content-center gap-2" id="miniaturas"></div>
        </div>

        <!-- columna derecha -->
        <div class="col-12 col-md-7 informacion_producto">
            <h2 id="nombreProducto" class="fw-bold"></h2>
            <p id="valoracionProducto" class="text-warning"></p>
            <h3 id="precioProducto" class="text-primary fw-bold"></h3>

            <p id="descripcionProducto"></p>

            <ul id="caracteristicasProducto"></ul>

            <div class="mt-3 d-flex gap-3">
                <button class="btn btn-primary">Agregar al carrito</button>
                <button class="btn btn-success">Comprar ahora</button>
            </div>

            <hr class="my-4">

            <h5 class="fw-bold">Recomendaciones</h5>
            <div class="d-flex flex-wrap gap-3" id="recomendaciones"></div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="DOM.js"></script>

</body>
</html>
