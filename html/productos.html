<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EZA | Emy,Zap,Azq</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/productos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <a class="visually-hidden-focusable p-3 position-absolute start-0 top-0 z-3 bg-light text-dark" href="#main-content">
        Saltar al contenido principal
    </a>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
            <div class="container-fluid">
                <img src="/img/Logo.png" alt="Logo del sitio EZA">
                
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menú</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav justify-content-center flex-grow-1 pe-3 gap-5">
                            <li class="nav-item">
                                <a class="nav-link" href="/html/home.html">INICIO</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/html/productos.html">PRODUCTOS</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/html/formulario.html">ENCUESTA DE SATISFACCIÓN</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content">
        
        <h1 class="visually-hidden">Catálogo de Productos EZA</h1>

        <div class="search-container mt-3 ms-4 me-4">
            <form class="search-form d-flex align-items-center">
                <label for="search-input" class="visually-hidden">Buscar productos</label>
                
                <input id="search-input" type="text" placeholder="Buscas algo especial?" class="form-control search-input me-2">
                
                <button type="submit" class="btn p-0 border-0 bg-transparent" aria-label="Buscar">
                    <img src="https://images.icon-icons.com/1129/PNG/512/searchmagnifierinterfacesymbol1_79893.png" class="search-icon" alt=""> 
                </button>
            </form>

            <button id="cart-button" class="btn btn-cart position-relative" aria-label="Ver carrito de compras">
                <img src="https://images.icon-icons.com/1369/PNG/512/-shopping-cart_90604.png" class="cart-icon" alt="">
                <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                    0
                </span>
            </button>
        </div>

        <div class="principal-container container-fluid mt-3">
            <div class="row"> 
                <div class="col-md-3">
                    <nav aria-label="Categorías de productos">
                        <ul class="nav flex-column p-3">
                            <li class="nav-item mb-2">
                                <h2 class="h6 fw-bold text-uppercase text-dark">Categoría</h2>
                            </li>
                            <li class="nav-item"><a class="nav-link active text-dark" href="#">Todo</a></li>
                            <li class="nav-item"><a class="nav-link text-dark" href="#">Audio</a></li>
                            <li class="nav-item"><a class="nav-link text-dark" href="#">Video</a></li>
                            <li class="nav-item"><a class="nav-link text-dark" href="#">Celulares</a></li>
                            <li class="nav-item"><a class="nav-link text-dark" href="#">Relojes</a></li>
                            <li class="nav-item"><a class="nav-link text-dark" href="#">Reparaciones</a></li>
                        </ul>
                    </nav>
                </div>

                <div class="col-md-9">
                    <div id="productos-container" class="row row-cols-1 row-cols-md-3 g-4"></div>
                </div>
            </div>

            <div id="cart-overlay"></div>
            
            <div id="sidebar-cart">
                <div class="cart-header">
                    <h5 class="fw-bold mb-0">Carrito de Compras</h5>
                    <button class="close-cart" aria-label="Cerrar carrito">&times;</button>
                </div>
                <div id="cart-items" class="list-unstyled mb-3"></div>
                <div class="cart-footer">
                    <p class="fw-bold">Total: <span id="sidebar-cart-total">$0.00</span></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white text-center py-3 mt-4 border-top">
        <p class="mb-0 text-muted">&copy; 2024 EZA. Todos los derechos reservados.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/js/controller/productsController.js"></script>
    <script src="/js/model/productsModel.js"></script>
    <script src="/js/view/productsView.js"></script>
    <script> 
        controller = new ProductsController(); 
    </script>
</body>
</html>
